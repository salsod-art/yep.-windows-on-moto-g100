name: Build UEFI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Check source tree
        run: |
          pwd
          ls -la
          test -f build_uefi.py
          test -f pip-requirements.txt
          test -f setup_env.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            clang \
            llvm \
            lld \
            nasm \
            uuid-dev \
            gcc-aarch64-linux-gnu \
            mono-devel \
            python3 \
            python3-pip

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r pip-requirements.txt

      - name: Build UEFI
        run: |
          python3 build_uefi.py -d nio

      - name: Find build outputs
        run: |
          echo "Build outputs:"
          find . -type f \( \
            -name "*.img" -o \
            -name "*.efi" -o \
            -name "*.fd" -o \
            -name "*.bin" \
          \) -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nio-uefi
          path: |
            **/*.img
            **/*.efi
            **/*.fd
            **/*.bin
          if-no-files-found: warn
